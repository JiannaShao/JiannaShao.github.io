<!-- =====================================================
     AQUARIUM / MY ROOM
====================================================== -->

<div id="aquarium-world">

    <div id="tank" class="tank">

        <div id="fish-layer"></div>

        <div id="water-overlay"></div>

        <div id="food-layer"></div>

        <div id="bubble-layer"></div>

    </div>


    <div class="aquarium-controls">

        <button
            id="feed-button"
            class="aquarium-button"
        >
            Feed the Fish
        </button>

        <button
            id="reset-button"
            class="aquarium-button secondary"
        >
            Reset Aquarium
        </button>

    </div>

</div>


<!-- =====================================================
     BOOK DATA / BOOK CLICK TARGET
====================================================== -->

<div id="book-world">

    <div
        class="book-object"
        data-book="book1"
    >
        <img
            src="Books/Book1.png"
            alt="The Strange Case of Dr Jekyll and Mr Hyde"
            draggable="false"
        >
    </div>


    <div
        class="book-object"
        data-book="book2"
    >
        <img
            src="Books/Book2.jpg"
            alt="Breakneck"
            draggable="false"
        >
    </div>


    <div
        class="book-object"
        data-book="book3"
    >
        <img
            src="Books/Book3.jpeg"
            alt="The 5 Types of Wealth"
            draggable="false"
        >
    </div>

</div>


<script src="aquarium.js"></script>
<script type="module" src="art.js"></script>
