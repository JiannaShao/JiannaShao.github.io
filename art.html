<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Artwork | Jianna Shao</title>

    <link
        rel="stylesheet"
        href="art.css"
    >

</head>


<body>


    <!-- =====================================================
         3D GALLERY
    ====================================================== -->

    <div id="gallery"></div>



    <!-- =====================================================
         NAVIGATION
    ====================================================== -->

    <a
        href="index.html"
        class="home-button"
    >
        ← Back to Home
    </a>



    <!-- =====================================================
         GALLERY TITLE
    ====================================================== -->

    <div class="gallery-title">

        <p>
            ARTWORK &amp; MUSIC
        </p>

    </div>



    <!-- =====================================================
         ARTWORK INFORMATION
    ====================================================== -->

    <div
        id="artwork-info"
        class="artwork-info hidden"
    >

        <button
            id="close-info"
            type="button"
            aria-label="Close artwork information"
        >
            ×
        </button>


        <p id="artwork-year"></p>

        <h2 id="artwork-title"></h2>

        <p id="artwork-medium"></p>

        <p id="artwork-description"></p>

    </div>



    <!-- =====================================================
         MUSIC PLAYER
    ====================================================== -->

    <div class="music-player">

        <div class="ipod">


            <!-- IPOD SCREEN -->

            <div class="ipod-screen">

                <p class="music-label">
                    NOW PLAYING
                </p>

                <div
                    id="album-name"
                    class="album-name"
                >
                    Select an album
                </div>

                <div
                    id="song-title"
                    class="song-title"
                >
                    —
                </div>

                <div
                    id="artist-name"
                    class="artist-name"
                >
                    —
                </div>

            </div>



            <!-- IPOD WHEEL -->

            <div class="ipod-wheel">

                <button
                    id="previous"
                    class="wheel-button previous"
                    type="button"
                    aria-label="Previous song"
                >
                    ◀
                </button>


                <button
                    id="play"
                    class="play-button"
                    type="button"
                    aria-label="Play"
                >
                    ▶
                </button>


                <button
                    id="next"
                    class="wheel-button next"
                    type="button"
                    aria-label="Next song"
                >
                    ▶
                </button>

            </div>



            <!-- ALBUM BUTTON -->

            <button
                id="album-button"
                class="album-button"
                type="button"
            >
                Albums
            </button>

        </div>



        <!-- ALBUM MENU -->

        <div
            id="album-menu"
            class="album-menu hidden"
        >

            <p>
                SELECT ALBUM
            </p>

            <div id="album-list"></div>

        </div>

    </div>



    <!-- =====================================================
         INSTRUCTIONS
    ====================================================== -->

    <div class="instructions">

        <span>
            Use W A S D to move
        </span>

        <span>
            Press mouse to look around
        </span>

        <span>
            Click artwork to view details
        </span>

    </div>



    <!-- =====================================================
         AQUARIUM / MY ROOM
    ====================================================== -->

    <div id="aquarium-world">


        <!-- AQUARIUM -->

        <div
            id="tank"
            class="tank"
        >

            <!-- FISH -->

            <div id="fish-layer"></div>


            <!-- WATER MOVEMENT -->

            <div id="water-overlay"></div>


            <!-- FOOD -->

            <div id="food-layer"></div>


            <!-- BUBBLES -->

            <div id="bubble-layer"></div>

        </div>



        <!-- AQUARIUM CONTROLS -->

        <div class="aquarium-controls">

            <button
                id="feed-button"
                class="aquarium-button"
                type="button"
            >
                Feed the Fish
            </button>


            <button
                id="reset-button"
                class="aquarium-button secondary"
                type="button"
            >
                Reset Aquarium
            </button>

        </div>

    </div>



    <!-- =====================================================
         BOOKS / MY ROOM
    ====================================================== -->

    <div id="book-world">


        <!-- BOOK 1 -->

        <div
            class="book-object"
            data-book="book1"
        >

            <img
                src="Books/Book1.png"
                alt="The Strange Case of Dr Jekyll and Mr Hyde"
                draggable="false"
            >

        </div>



        <!-- BOOK 2 -->

        <div
            class="book-object"
            data-book="book2"
        >

            <img
                src="Books/Book2.jpg"
                alt="Breakneck"
                draggable="false"
            >

        </div>



        <!-- BOOK 3 -->

        <div
            class="book-object"
            data-book="book3"
        >

            <img
                src="Books/Book3.jpeg"
                alt="The 5 Types of Wealth"
                draggable="false"
            >

        </div>

    </div>



    <!-- =====================================================
         AQUARIUM JAVASCRIPT
    ====================================================== -->

    <script src="aquarium.js"></script>



    <!-- =====================================================
         THREE.JS IMPORT MAP
    ====================================================== -->

    <script type="importmap">

    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
    }

    </script>



    <!-- =====================================================
         THREE.JS GALLERY
    ====================================================== -->

    <script
        type="module"
        src="art.js"
    ></script>


</body>

</html>
