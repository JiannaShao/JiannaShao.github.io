<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Aquarium</title>

    <link rel="stylesheet" href="aquarium.css">
</head>


<body>

    <main class="page">

        <!-- =========================
             HEADER
        ========================== -->

        <header class="header">

            <div class="header-text">

                <p class="eyebrow">
                    INTERACTIVE EXPERIMENT
                </p>

                <h1>
                    My Aquarium
                </h1>

                <p class="subtitle">
                    Watch the fish swim around their tank.
                </p>

            </div>


            <div class="stats">

                <div class="stat">
                    <span class="stat-number">
                        15
                    </span>

                    <span class="stat-label">
                        Fish
                    </span>
                </div>


                <div class="stat">
                    <span id="food-count" class="stat-number">
                        0
                    </span>

                    <span class="stat-label">
                        Food
                    </span>
                </div>

            </div>

        </header>


        <!-- =========================
             AQUARIUM
        ========================== -->

        <section class="tank-container">

            <div id="tank" class="tank">

                <!-- Water lighting -->

                <div class="water-glow"></div>


                <!-- Plants -->

                <div class="plant plant-one"></div>

                <div class="plant plant-two"></div>

                <div class="plant plant-three"></div>


                <!-- Rocks -->

                <div class="rock rock-one"></div>

                <div class="rock rock-two"></div>


                <!-- Food -->

                <div id="food-layer"></div>


                <!-- Fish -->

                <div id="fish-layer"></div>


                <!-- Bubbles -->

                <div id="bubble-layer"></div>


                <!-- Sand -->

                <div class="sand"></div>

            </div>

        </section>


        <!-- =========================
             CONTROLS
        ========================== -->

        <section class="controls">

            <button
                id="feed-button"
                class="primary-button"
            >
                🌽 Feed the Fish
            </button>


            <button
                id="reset-button"
                class="secondary-button"
            >
                Reset Aquarium
            </button>

        </section>


        <!-- =========================
             STATUS MESSAGE
        ========================== -->

        <p
            id="message"
            class="message"
        >
            The aquarium is peaceful...
        </p>


        <!-- =========================
             NAVIGATION
        ========================== -->

        <a
            class="back-link"
            href="index.html"
        >
            ← Back to portfolio
        </a>

    </main>


    <script src="aquarium.js"></script>

</body>

</html>
