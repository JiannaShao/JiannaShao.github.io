<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="520" fill="#F9FCFB"/>
  <defs><marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#182335"/></marker></defs>
  <text x="40" y="44" font-size="20" font-weight="700" fill="#182335">The autonomous lab, simplified</text>
  <text x="40" y="68" font-size="13" fill="#4a5468">An AI agent plans each run and directs the industrial robot arm and the Hyrel 3D system</text>
  <!-- floor -->
  <path d="M40 470 H760" stroke="#182335" stroke-width="2" opacity=".35"/>
  <!-- Hyrel-style open-frame system -->
  <g>
    <rect x="420" y="150" width="300" height="310" fill="#EAF4F6" opacity=".55"/>
    <rect x="420" y="150" width="300" height="310" fill="none" stroke="#182335" stroke-width="12" stroke-linejoin="round"/>
    <rect x="410" y="458" width="30" height="12" fill="#182335"/><rect x="700" y="458" width="30" height="12" fill="#182335"/>
    <!-- z rails -->
    <rect x="446" y="160" width="8" height="290" fill="#8a94a3"/><rect x="686" y="160" width="8" height="290" fill="#8a94a3"/>
    <!-- gantry -->
    <rect x="430" y="196" width="280" height="16" rx="3" fill="#182335"/>
    <!-- tool head -->
    <rect x="535" y="182" width="72" height="66" rx="6" fill="#FFA58A" stroke="#182335" stroke-width="3"/>
    <path d="M555 248 H587 L577 272 H565 Z" fill="#182335"/>
    <path d="M552 182 C552 160 560 150 575 140" fill="none" stroke="#182335" stroke-width="3"/>
    <path d="M590 182 C592 162 600 152 612 146" fill="none" stroke="#182335" stroke-width="3"/>
    <!-- heated bed + substrate -->
    <rect x="462" y="372" width="218" height="16" rx="3" fill="#182335"/>
    <rect x="530" y="360" width="80" height="12" fill="#d9dee4" stroke="#182335" stroke-width="2"/>
    <rect x="530" y="356" width="80" height="4" fill="#D96A4C"/>
    <path d="M571 274 V350" stroke="#D96A4C" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="570" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#182335"></text>
  </g>
  <!-- robot arm -->
  <g>
    <rect x="110" y="438" width="120" height="32" rx="6" fill="#182335"/>
    <rect x="140" y="400" width="60" height="42" rx="8" fill="#182335"/>
    <circle cx="170" cy="396" r="22" fill="#FFA58A" stroke="#182335" stroke-width="4"/>
    <path d="M170 396 L250 250" stroke="#182335" stroke-width="30" stroke-linecap="round"/>
    <circle cx="250" cy="250" r="18" fill="#FFA58A" stroke="#182335" stroke-width="4"/>
    <path d="M250 250 L392 300" stroke="#182335" stroke-width="22" stroke-linecap="round"/>
    <circle cx="392" cy="300" r="12" fill="#FFA58A" stroke="#182335" stroke-width="3"/>
    <path d="M392 300 L420 340" stroke="#182335" stroke-width="12" stroke-linecap="round"/>
    <path d="M412 344 L404 362 M432 336 L442 354" stroke="#182335" stroke-width="5" stroke-linecap="round"/>
    <rect x="402" y="358" width="44" height="9" fill="#d9dee4" stroke="#182335" stroke-width="1.5"/>
  </g>
  <!-- AI agent -->
  <g>
    <rect x="60" y="110" width="170" height="92" rx="10" fill="#182335"/>
    <rect x="72" y="122" width="146" height="58" rx="4" fill="#26364f"/>
    <path d="M84 140 H170 M84 152 H200 M84 164 H150" stroke="#FFA58A" stroke-width="4" stroke-linecap="round"/>
    <rect x="130" y="202" width="30" height="10" fill="#182335"/>
    <text x="145" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#182335">AI agent</text>
    <path d="M232 150 C320 150 400 150 470 186" fill="none" stroke="#182335" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar2)"/>
    <path d="M150 240 C150 270 175 300 205 318" fill="none" stroke="#182335" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar2)"/>
  </g>
  <g font-size="14" fill="#182335">
    <text x="170" y="496" text-anchor="middle" font-weight="700">Industrial robot arm</text>
    <text x="570" y="496" text-anchor="middle" font-weight="700">Hyrel 3D system</text>
    <text x="618" y="352" font-size="12">substrate</text>
    <text x="616" y="214" font-size="12" fill="#F9FCFB" opacity="0"></text>
  </g>
  <text x="760" y="512" text-anchor="end" font-size="11" fill="#4a5468">Illustration, not to scale</text>
</svg>
