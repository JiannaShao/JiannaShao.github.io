<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Art Portfolio</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #f3f1e8;
            color: #111111;
            font-family: Helvetica, Arial, sans-serif;
        }


        /* =========================
           DESKTOP SELECTION
        ========================= */

        .selection-page {

            min-height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            padding: 40px;

        }


        h1 {

            margin: 0 0 15px;

            font-family: Georgia, serif;
            font-size: 48px;
            font-weight: normal;

        }


        .subtitle {

            margin: 0 0 50px;

            font-size: 17px;

            text-align: center;

            max-width: 600px;

            line-height: 1.6;

        }


        .options {

            display: flex;

            gap: 30px;

            width: min(900px, 100%);

        }


        .option {

            flex: 1;

            min-height: 300px;

            background: #ffffff;

            border: 1px solid #111111;

            text-decoration: none;

            color: #111111;

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 40px;

            transition:
                transform 0.2s ease,
                background-color 0.2s ease;

        }


        .option:hover {

            transform: translateY(-5px);

            background: #ebe8dc;

        }


        .option h2 {

            margin: 0 0 15px;

            font-family: Georgia, serif;

            font-size: 30px;

            font-weight: normal;

        }


        .option p {

            margin: 0;

            max-width: 300px;

            line-height: 1.6;

            font-size: 15px;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .selection-page {

                display: none;

            }

        }

    </style>

</head>


<body>

    <main class="selection-page">

        <h1>My Art</h1>

        <p class="subtitle">
            Explore my artwork through an interactive gallery
            or browse it as a traditional portfolio.
        </p>


        <div class="options">

            <a
                class="option"
                href="art.html"
            >

                <h2>
                    Interactive Gallery
                </h2>

                <p>
                    Walk through a virtual gallery and
                    explore the artwork in three dimensions.
                </p>

            </a>


            <a
                class="option"
                href="art-portfolio.html"
            >

                <h2>
                    Traditional Portfolio
                </h2>

                <p>
                    Browse the artwork in a simple,
                    image-focused portfolio.
                </p>

            </a>

        </div>

    </main>


    <!--
        MOBILE REDIRECT

        Mobile users automatically go to the
        traditional portfolio.
    -->

    <script>

        function checkMobile() {

            if (
                window.innerWidth <= 700
            ) {

                window.location.replace(
                    "art-portfolio.html"
                );

            }

        }


        checkMobile();


        window.addEventListener(
            "resize",
            checkMobile
        );

    </script>

</body>

</html>
